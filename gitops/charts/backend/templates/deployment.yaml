apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: backend}
  template:
    metadata:
      labels: {app: backend}
    spec:
      imagePullSecrets:
        {{ toYaml .Values.imagePullSecrets | indent 8 }}
containers:
  - name: backend
    image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
    ports:
      - containerPort: 8000
    env:
      - name: DB_HOST
        value: postgres
      - name: DB_NAME
        value: appdb
      - name: DB_USER
        value: appuser
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-auth
            key: password
    readinessProbe:
      httpGet: {path: /health, port: 8000}
      initialDelaySeconds: 3
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 500m, memory: 256Mi}
