apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd-ns
spec:
  project: default
  source:
    repoURL: https://github.com/glejnhithi/devops-final-project.git
    targetRevision: HEAD
    path: gitops/charts/backend
    helm:
      releaseName: backend
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
