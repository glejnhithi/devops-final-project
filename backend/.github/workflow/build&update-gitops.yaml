name: Build and update GitOps
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test backend
        run: |
          python -m pip install -r requirements.txt pytest
          pytest -q
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devops-backend:${{ github.sha }}
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: REPLACE_OWNER/gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Update image tag
        env:
          SHA: ${{ github.sha }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          p=Path('gitops/charts/backend/values.yaml')
          lines=p.read_text().splitlines()
          out=[]
          for line in lines:
              if line.strip().startswith('repository:'):
                  line='  repository: '+os.environ['DOCKERHUB_USER']+'/devops-backend'
              elif line.strip().startswith('tag:'):
                  line='  tag: '+os.environ['SHA']
              out.append(line)
          p.write_text('\n'.join(out)+'\n')
          PYCODE
      - name: Commit and push GitOps update
        working-directory: gitops
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add charts/backend/values.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(backend): deploy ${{ github.sha }}'
          git push
